main: net.tfminecraft.armourshop.ArmourShop
api-version: '1.21.10'
name: "ArmourShop"
version: ${project.version}
author: Drefvelin

depend: [TLibs, ItemsAdder, TFMCWeb]
softdepend: [MMOItems, MythicLib, LuckPerms]

commands:
  armourshop:
      usage: /<command> | /<command> reload | /<command> token delete <code> | /<command> listtokens | /<command> pack pull | /<command> catalog sync | /<command> submission delete <id> | /<command> skin delete <id> | /<command> model apply <category_id> <skin_id>
      description: Open ArmourShop, reload, admin token tools, or pull approved packs

permissions:
  armourshop.admin:
    description: Admin perms for ArmourShop (reload, listtokens, token delete, pack pull)
    default: false
